[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dnaharness"
version = "0.1.0"
description = "Harbor experiments: how harness (coding vs RLM) and checkpoint (Qwen3 vs BioReason) affect DNA-input utilization on KEGG variant->disease prediction"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "httpx>=0.27",
    "datasets>=2.19",
]

[project.optional-dependencies]
# Orchestration env (Python >= 3.12 because Harbor requires it).
harbor = ["harbor==0.27.*"]
# GPU serving env: vLLM + the LM gateway (FastAPI) + native BioReason embedding construction.
serve = ["vllm==0.21.0", "fastapi>=0.110", "uvicorn>=0.29", "safetensors>=0.4", "transformers>=5.6"]
# Stage-3 SFT.
train = ["trl>=0.19", "peft>=0.15", "accelerate>=1.0", "transformers>=5.6", "safetensors>=0.4"]
analysis = ["scipy>=1.11", "matplotlib>=3.8", "tabulate>=0.9", "scikit-learn>=1.5"]
dev = ["pytest>=8", "rlms==0.1.3", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dnaharness" = ["adapters/*/templates/**/*", "runtime/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs the HF dataset (downloads wanglab/kegg)",
    "gpu: needs a GPU and model weights",
]
