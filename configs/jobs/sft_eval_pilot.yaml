# Stage 3 evaluation (trimmed plan, user decision 2026-11-22), part 1/3: harness competence on the
# non-biological pilot tasks, for every adaptation condition under both harnesses.
name: sft_eval_pilot
serve: {models: [bioreason-1.7b, bioreason-1.7b-sft-coding, bioreason-1.7b-sft-rlm, bioreason-1.7b-sft-answer], policy: sampled}
datasets: [harness-pilot/pilot]
n_attempts: 3
n_concurrent_trials: 28
cells:
  # 1. instructions only (re-run here: the original pilot used a 900 s client timeout)
  - {arm: coding_repl, model: bioreason-1.7b}
  - {arm: rlm,         model: bioreason-1.7b}
  # 2. instructions + k=3 in-context demonstrations
  - {arm: coding_repl, model: bioreason-1.7b, kwargs: {demos_file: "${root}/sft_data/bioreason-1.7b/demos_coding.txt"}}
  - {arm: rlm,         model: bioreason-1.7b, kwargs: {demos_file: "${root}/sft_data/bioreason-1.7b/demos_rlm.txt"}}
  # 3-5. SFT conditions under BOTH harnesses
  - {arm: coding_repl, model: bioreason-1.7b-sft-coding}
  - {arm: rlm,         model: bioreason-1.7b-sft-coding}
  - {arm: coding_repl, model: bioreason-1.7b-sft-rlm}
  - {arm: rlm,         model: bioreason-1.7b-sft-rlm}
  - {arm: coding_repl, model: bioreason-1.7b-sft-answer}
  - {arm: rlm,         model: bioreason-1.7b-sft-answer}
  # root-only diagnostic: SFT root orchestrating the ORIGINAL child
  - {arm: rlm, model: bioreason-1.7b-sft-rlm, kwargs: {child_model: bioreason-1.7b}}
